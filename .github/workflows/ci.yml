name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Meno privilegi possibile (#130): i job di CI non scrivono nulla. Il blocco
# esplicito protegge anche se il default del repo (già read-only, verificato
# via API) dovesse cambiare.
permissions:
  contents: read

jobs:
  composer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: ./.github/actions/setup
        with:
          php-version: '8.5'

      - name: Composer Install
        run: composer install -q --no-interaction --optimize-autoloader --no-progress --audit

      - name: Composer Outdated
        continue-on-error: true
        run: composer outdated --direct --strict

  npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: NPM Install
        run: npm ci

      - name: NPM Audit
        run: npm audit --omit=dev

      - name: NPM Outdated
        continue-on-error: true
        run: npm outdated

  eslint:
    runs-on: ubuntu-latest
    needs: [composer, npm]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: NPM Install
        run: npm ci

      - name: Run ESLint
        run: npm run lint:scripts

  pint:
    runs-on: ubuntu-latest
    needs: [composer, npm]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: ./.github/actions/setup
        with:
          php-version: '8.5'

      - name: Composer Install
        run: composer install -q --no-interaction --optimize-autoloader --no-progress

      - name: Run Pint
        run: vendor/bin/pint --verbose --test

  phpstan:
    runs-on: ubuntu-latest
    needs: [composer, npm]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: ./.github/actions/setup
        with:
          php-version: '8.5'

      - name: Composer Install
        run: composer install -q --no-interaction --optimize-autoloader --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --verbose --no-progress --memory-limit 512M

  stylelint:
    runs-on: ubuntu-latest
    needs: [composer, npm]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: NPM Install
        run: npm ci

      - name: Run Stylelint
        run: npm run lint:styles

  pest:
    runs-on: ubuntu-latest
    needs: [eslint, pint, phpstan, stylelint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Test Suite
        uses: ./.github/actions/test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # La build reale del target production valida i bump settimanali di
      # digest che il guard test Pest vede solo textualmente (#112): un base
      # incompatibile (es. intl) emerge qui e non al deploy. La cache gha
      # riusa i layer composer/npm tra i run.
      - name: Build Production Image
        run: docker buildx build --target production --cache-from type=gha --cache-to type=gha,mode=max --tag pawdesk-ci:${{ github.sha }} .
