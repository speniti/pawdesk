name: Test

description: Run the Pest test suite

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: ./.github/actions/setup
      with:
        php-version: '8.5'
        coverage: pcov

    - name: Composer Install
      run: composer install -q --no-interaction --optimize-autoloader --no-progress
      shell: bash

    - name: Setup Environment
      run: |
        cp .env.example .env
        php artisan key:generate
      shell: bash

    # Copertura misurata al primo run con pcov: 95.3% (#83). La soglia a 92
    # lascia ~3 punti di margine anti-fluttuazione tra ambienti e mura
    # contro le regressioni; alzarla è una decisione consapevole.
    - name: Run Pest
      run: vendor/bin/pest --ci --coverage --min=92
      shell: bash
