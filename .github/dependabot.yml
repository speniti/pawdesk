# Aggiornamenti automatici delle dipendenze (#74): PR settimanali (default: lunedì).
# - composer/npm: bump del lockfile, si affiancano ai bump guidati da
#   composer audit / npm audit in CI
# - docker: aggiorna tag e digest delle immagini base del Dockerfile
# - github-actions: bump delle action usate dai workflow (supply chain CI)
# I compose file restano fuori per scelta (#74): le immagini lì sono dev-only.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    # Minor/patch insieme (rumore ridotto); i major del runtime restano PR
    # individuali per revisione dedicata.
    groups:
      composer-minor-patch:
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    # Dev deps raggruppate in UNA PR (major incluse): i major accoppiati
    # (stylelint + stylelint-config-standard, typescript + typescript-eslint)
    # non possono viaggiare separati senza rompere la risoluzione peer
    # (#123/#128/#127).
    groups:
      npm-dev:
        dependency-type: development
    # typescript-eslint 8.x dichiara peer "typescript <6.1.0" (verificato su
    # registry): TS 7 rompe npm ci finché non esce una major compatibile.
    ignore:
      - dependency-name: typescript
        versions: ['7.x']
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    # Le action di CI si validano da sole sulla PR che le tocca (CI rossa =
    # bump problematico): raggrupparle evita una PR separata per ogni major.
    groups:
      gh-actions:
        patterns:
          - '*'
    schedule:
      interval: weekly
