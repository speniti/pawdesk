# Stack di produzione, entrypoint per Dokploy (Compose file path).
# Non carica docker-compose.override.yml: solo i servizi di produzione.
#
#   app       FrankenPHP (HTTP, porta interna 8080); all'avvio esegue
#             storage:link + migrate --force + optimize (AUTORUN_ENABLED)
#   worker    coda database: php artisan queue:work
#   scheduler php artisan schedule:work
#
# Il dominio/le label Traefik si configurano nel tab Domains di Dokploy
# sul servizio `app`, porta 8080. L'.env è fornito dal tab Environment.
include:
  - docker-compose.yml

services:
  app:
    build:
      context: .
      target: production
    environment:
      PHP_OPCACHE_ENABLE: "1"
      # Il server può ignorare depends_on (modalità Stack di Dokploy): all'avvio
      # l'immagine esegue storage:link + migrate --force + optimize da sola.
      AUTORUN_ENABLED: "true"
      # SQLite fuori da database/ così il volume contiene solo il file DB (e i
      # suoi -wal/-shm): database/ resta nel codice dell'immagine, sempre aggiornato.
      DB_DATABASE: /app-data/database.sqlite
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - app-data:/app-data
      - app-storage:/var/www/html/storage

  worker:
    build:
      context: .
      target: production
    container_name: peniti_worker
    environment:
      PHP_OPCACHE_ENABLE: "1"
      DB_DATABASE: /app-data/database.sqlite
    command: php artisan queue:work --tries=3 --backoff=10
    env_file:
      - .env
    networks:
      - pawdesk
    restart: unless-stopped
    volumes:
      - app-data:/app-data
      - app-storage:/var/www/html/storage
    # Parte solo quando app è healthy, quindi dopo l'autorun delle migration.
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    build:
      context: .
      target: production
    container_name: peniti_scheduler
    environment:
      PHP_OPCACHE_ENABLE: "1"
      DB_DATABASE: /app-data/database.sqlite
    command: php artisan schedule:work
    env_file:
      - .env
    networks:
      - pawdesk
    restart: unless-stopped
    volumes:
      - app-data:/app-data
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy

networks:
  pawdesk:
    name: dokploy-network
    external: true

volumes:
  app-data:
  app-storage:
