# Stack di produzione, entrypoint per Dokploy (Compose file path).
# Non carica docker-compose.override.yml: solo i servizi di produzione.
#
#   app       FrankenPHP (HTTP, porta interna 8080); all'avvio esegue
#             storage:link + migrate --force + optimize (AUTORUN_ENABLED)
#   worker    coda database: php artisan queue:work
#   scheduler php artisan schedule:work
#
# Il dominio/le label Traefik si configurano nel tab Domains di Dokploy
# sul servizio `app`, porta 8080. L'.env è fornito dal tab Environment.
include:
  - docker-compose.yml

services:
  app:
    build:
      context: .
      target: production
    environment:
      # environment: batte env_file:, quindi questi due valori vincono anche
      # se il .env del tab Environment dovesse portare quelli di sviluppo (#73).
      APP_ENV: "production"
      APP_DEBUG: "0"
      PHP_OPCACHE_ENABLE: "1"
      # Il server può ignorare depends_on (modalità Stack di Dokploy): all'avvio
      # l'immagine esegue storage:link + migrate --force + optimize da sola.
      AUTORUN_ENABLED: "true"
      # SQLite in storage/ (directory persistente di Laravel, volume condiviso):
      # database/ resta codice dell'immagine, sempre aggiornato a ogni deploy.
      DB_DATABASE: /var/www/html/storage/app/private/database.sqlite
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      # Guardia rilevativa (#73): il container viene marcato unhealthy se il
      # debug è attivo in produzione. Traefik instrada per label a prescindere
      # dalla health, quindi su app è diagnostica; per worker e scheduler la
      # stessa guardia è bloccante (il processo esce prima di partire).
      test: ["CMD-SHELL", "php artisan app:check-production-config && curl -fsS http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - app-storage:/var/www/html/storage

  worker:
    build:
      context: .
      target: production
    container_name: peniti_worker
    environment:
      APP_ENV: "production"
      APP_DEBUG: "0"
      PHP_OPCACHE_ENABLE: "1"
      DB_DATABASE: /var/www/html/storage/app/private/database.sqlite
    # Compose splitte il command con shlex (niente shell): `sh -c` serve per
    # la guardia, `exec` per mantenere i segnali sul processo di queue (#73).
    command: sh -c 'php artisan app:check-production-config && exec php artisan queue:work --tries=3 --backoff=10'
    env_file:
      - .env
    networks:
      - pawdesk
    restart: unless-stopped
    volumes:
      - app-storage:/var/www/html/storage
    # Parte solo quando app è healthy, quindi dopo l'autorun delle migration.
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    build:
      context: .
      target: production
    container_name: peniti_scheduler
    environment:
      APP_ENV: "production"
      APP_DEBUG: "0"
      PHP_OPCACHE_ENABLE: "1"
      DB_DATABASE: /var/www/html/storage/app/private/database.sqlite
    command: sh -c 'php artisan app:check-production-config && exec php artisan schedule:work'
    env_file:
      - .env
    networks:
      - pawdesk
    restart: unless-stopped
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy

networks:
  pawdesk:
    name: dokploy-network
    external: true

volumes:
  app-storage:
